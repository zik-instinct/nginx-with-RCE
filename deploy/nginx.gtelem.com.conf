server {
    server_name nginx.gtelem.com;

    root /var/www/nginx-with-RCE;
    index index.html;

    access_log /var/log/nginx/nginx-with-rce.access.log;
    error_log  /var/log/nginx/nginx-with-rce.error.log;

    location = /api/command {
        client_max_body_size 256;
        client_body_timeout 3s;
        proxy_pass http://127.0.0.1:8766;
        proxy_connect_timeout 1s;
        proxy_read_timeout 6s;
        proxy_send_timeout 3s;
    }

    location ~ \.(bak|pre-whitelist)$ {
        deny all;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    location ~ /\. {
        deny all;
    }

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/nginx.gtelem.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/nginx.gtelem.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}
server {
    if ($host = nginx.gtelem.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name nginx.gtelem.com;
    return 404; # managed by Certbot


}
