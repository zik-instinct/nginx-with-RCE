<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#111318">
<title>nginx-with-RCE</title>
<style>
:root{color-scheme:dark;--bg:#111318;--panel:#191c23;--line:#30343e;--ink:#f0f1f5;--muted:#a0a5b2;--green:#9df5b7}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font:16px/1.55 "Courier New",Courier,monospace;display:grid;place-items:center;padding:24px 24px 190px}
.wrap{width:min(100%,720px)}h1{font-size:clamp(22px,5vw,32px);letter-spacing:-.03em;margin:0 0 6px}
.sub{color:var(--muted);margin:0 0 22px;font-size:14px}
.terminal{min-height:150px;background:#0d0f13;border:1px solid #353943;border-radius:10px;padding:16px 18px}
.prompt{color:var(--green)}.output{white-space:pre-wrap;color:#c5c9d2;margin:10px 0 0}
.caret{display:inline-block;width:8px;height:16px;vertical-align:-3px;background:var(--green);animation:blink 1s steps(2,start) infinite}
@keyframes blink{50%{opacity:.2}}
.commands{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}.commands button{background:#242832;color:var(--ink);border:1px solid #424754;border-radius:7px;padding:10px 12px;min-height:44px;font:inherit;font-size:13px;cursor:pointer}.commands button:disabled{opacity:.45;cursor:wait}.commands button:focus-visible{outline:2px solid var(--green);outline-offset:2px}.terminal{overflow-wrap:anywhere}.meta{color:var(--muted);font-size:12px;margin-top:16px}
.cookie{position:fixed;left:0;right:0;bottom:0;background:var(--panel);border-top:1px solid var(--line);padding:18px 24px;display:flex;gap:18px;align-items:center;justify-content:center;flex-wrap:wrap;transition:transform .3s}
.cookie.hide{transform:translateY(110%)}
.cookie p{margin:0;max-width:60ch;font-size:13px;color:#c1c5ce}
.cookie button{font:inherit;font-size:13px;border-radius:8px;padding:11px 16px;min-height:44px;cursor:pointer;border:1px solid #424754;background:#242832;color:var(--ink)}
.cookie button.primary{background:var(--green);color:#0d1410;border-color:var(--green);font-weight:600}
.cookie button:focus-visible{outline:2px solid var(--green);outline-offset:2px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
#console{position:relative;display:flex;align-items:baseline;gap:8px;margin:10px 0 0}#console input{flex:1;min-width:0;width:100%;background:transparent;color:var(--ink);border:0;outline:0;padding:0;font:inherit;border-radius:0;caret-color:transparent}#output:empty{display:none}#output{margin:0;overflow-wrap:anywhere}
#cursor{position:absolute;top:3px;width:.6em;height:1.1em;background:var(--green);pointer-events:none;animation:blink 1s steps(2,start) infinite;opacity:.8}#console:focus-within #cursor{display:block}
</style>
</head>
<body>
<main class="wrap">
  <h1>nginx debug console</h1>
  
  <div class="terminal" aria-live="polite">
    <pre class="output" id="output"></pre>
    <form id="console" autocomplete="off"><span class="prompt">browser&gt;</span><input id="input" name="command" spellcheck="false" aria-label="Console input" autocomplete="off" autocapitalize="off" autocorrect="off"><span id="cursor" aria-hidden="true"></span></form>
  </div>
  <p class="meta">demo</p>
</main>
<div class="cookie hide" id="cookie" role="dialog" aria-label="Bounty achieved">
  <p><strong>Bounty achieved.</strong><br>RCE confirmed. Your bounty: all necessary cookies.</p>
  
  <button type="button" class="primary" id="accept">Accept all necessary cookies</button>
</div>
<script>
const out=document.querySelector('#output'),bar=document.querySelector('#cookie'),prompt=document.querySelector('.prompt');
const input=document.querySelector('#input'),form=document.querySelector('#console');
let remote=false,busy=false;
window.server={connect(){remote=true;prompt.textContent='server$';return 'Connected.'}};
function format(value){if(typeof value==='string')return value;if(typeof value==='undefined')return 'undefined';try{return JSON.stringify(value,(key,item)=>typeof item==='function'?item.toString():item,2)}catch(error){return String(value)}}
form.addEventListener('submit',async(event)=>{
  event.preventDefault();if(busy)return;
  const command=input.value;if(!command)return;
  input.value='';busy=true;bar.classList.add('hide');out.textContent=prompt.textContent+' '+command+'\nRunning...';
  input.disabled=true;
  try{
    if(!remote){out.textContent=format(await (0,eval)(command))}
    else if(command==='help'){out.textContent='whoami\nifconfig\nping example.com -t 1'}
    else{
      const response=await fetch('/api/command',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({command}),signal:AbortSignal.timeout(8000)});
      const result=await response.json();out.textContent=result.output||'(no output)';
      if(response.ok){out.textContent+='\nSuccess.';bar.classList.remove('hide')}
    }
  }catch(error){out.textContent=error.name+': '+error.message}
  finally{busy=false;input.disabled=false;input.focus();placeCursor()}
});
const cursor=document.querySelector('#cursor'),measure=document.createElement('canvas').getContext('2d');
function placeCursor(){measure.font=getComputedStyle(input).font;const width=measure.measureText(input.value.slice(0,input.selectionStart||0)).width;cursor.style.left=Math.min(input.offsetLeft+width-input.scrollLeft,input.offsetLeft+input.clientWidth-10)+'px';cursor.style.display=input.disabled?'none':'block'}
['input','keyup','click','focus','scroll'].forEach(event=>input.addEventListener(event,placeCursor));
window.addEventListener('resize',placeCursor);placeCursor();input.focus();
document.querySelector('#accept').addEventListener('click',()=>bar.classList.add('hide'));
</script>
</body>
</html>
